name: dependabot-automerge

# Minor and patch bumps of tako-sdk merge themselves once `ci` is green. A
# major stays open for a human. Needs two repo settings: "Allow auto-merge"
# on, and the `build-test` job of ci.yml as a required status check on main.
# Without the required check, `--auto` merges immediately.
#
# The merge is made with GITHUB_TOKEN, so it does not trigger `push` workflows
# (GitHub's anti-recursion rule). release-please therefore does not run on the
# bump commit. That is fine: a `chore(deps)` commit never produces a release,
# and the next `feat`/`fix` merge picks it up into the changelog.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: >-
          steps.meta.outputs.dependency-names == 'tako-sdk' &&
          (steps.meta.outputs.update-type == 'version-update:semver-minor' ||
           steps.meta.outputs.update-type == 'version-update:semver-patch')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
