name: ci

on:
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # Everything above tests src/. These two test the artifact a consumer
      # installs, which is where a missing file, an unresolvable `exports` map, or
      # a devDependency imported at run time shows up.
      - run: pnpm lint:package
      - run: pnpm test:package
